
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management & Results Analysis</h1>
    <p>افتحي Console لمشاهدة نتائج الطلاب</p>

    <script>

        // 1. إنشاء Class Student
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            // 2. حساب المتوسط باستخدام reduce
            calculateAverage() {
                let total = this.grades.reduce((sum, grade) => {
                    return sum + grade;
                }, 0);

                return total / this.grades.length;
            }

            // 3. تحديد التقدير
            getGrade() {
                let avg = this.calculateAverage();

                if (avg >= 90) {
                    return "A";
                } else if (avg >= 80) {
                    return "B";
                } else if (avg >= 70) {
                    return "C";
                } else if (avg >= 60) {
                    return "D";
                } else if (avg >= 50) {
                    return "E";
                } else {
                    return "F";
                }
            }

            // 4. تحديد النتيجة النهائية
            getResult() {
                let avg = this.calculateAverage();

                if (avg >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        // 5. إنشاء مصفوفة الطلاب
        let studentsList = [
            new Student(1, "Ahmed", [90, 85, 95], 90),
            new Student(2, "Mona", [45, 48, 42], 80),
            new Student(3, "Ali", [60, 65, 70], 85),
            new Student(4, "Sara", [40, 45, 48], 70)
        ];

        // 6. استخراج الطلاب المتعثرين باستخدام filter
        let strugglingStudents = studentsList.filter(student => {
            let avg = student.calculateAverage();
            return avg >= 40 && avg <= 49;
        });

        // 7. إضافة 5 درجات رأفة باستخدام map
        let mercyStudents = strugglingStudents.map(student => {
            return {
                id: student.id,
                name: student.name,
                oldAverage: student.calculateAverage(),
                newAverage: student.calculateAverage() + 5
            };
        });

        // 8. جمع المتوسطات الجديدة باستخدام reduce
        let totalAfterMercy = mercyStudents.reduce((sum, student) => {
            return sum + student.newAverage;
        }, 0);

        // 9. حساب متوسط الرأفة مع الحماية من القسمة على صفر
        let mercyAverage = mercyStudents.length > 0
            ? totalAfterMercy / mercyStudents.length
            : 0;

        // 10. طباعة تقرير جميع الطلاب
        console.log("===== Students Reports =====");

        studentsList.forEach(student => {
            console.log({
                Name: student.name,
                Average: student.calculateAverage(),
                Grade: student.getGrade(),
                Result: student.getResult()
            });
        });

        // 11. طباعة الطلاب المتعثرين بعد الرأفة
        console.log("===== Mercy Students =====");
        console.log(mercyStudents);

        // 12. طباعة متوسط درجات الرأفة
        console.log("===== Mercy Average =====");
        console.log(mercyAverage);

    </script>

</body>
</html>
